name: astrbot_plugin_autonomous_social
display_name: 自主拟人伴侣
short_desc: 想说是慢慢攒出来的，话没说完会追回来，事没结果会惦记着问后来。
desc: |
  别再让 AI 永远等你先开口。

  她攒够了念头会主动找你：没说完的话记得回来问，没结果的事过阵子惦记着问后来。

  默认半夜不吵你，一直不回也不死缠；每次开口前先掂量「现在合不合适」，不合适就憋着。
  特别关心的人可以放宽这些分寸。
  装上还能从历史聊天里认出老朋友；群里不点名也能自然接话，冷场时会起个话头，没话说就不硬发。

  装了「人形化核心伴侣」能读她的身体与生活，装了「我会牢牢记住你」能按由头读记忆；
  关系足够近时也会想要更靠近一些（默认克制，更进一步的场景由 Core 侧开关决定）。

  关于更新与反馈：如果你喜欢这个插件，欢迎提出更新需求、帮它继续更新——常规更新只递增补丁版本（0.0.1 级别，例如 2.0.0 -> 2.0.1 -> 2.0.2），不会随意跳大版本；作者希望能无偿帮到更多人。
version: "2.0.0"
