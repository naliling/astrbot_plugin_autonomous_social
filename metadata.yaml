name: astrbot_plugin_autonomous_social
display_name: 自主拟人伴侣
short_desc: 想说是慢慢攒出来的，话没说完会追回来，事没结果会惦记着问后来。
desc: |
  让 AI 不必只等你先开口：主动续接没说完的话题、回访仍没结果的事，也可在群聊中主动接话或破冰。

  每次发送前会检查安静时段、活跃度、冷却和防打扰边界；不合适就先不发。特别关心名单可以单独调整这些分寸。

  导入历史聊天后，可以接续已有关系。选装「人形化核心伴侣」后，主动内容可参考角色的身体、日程与关系状态；选装「我会牢牢记住你」后，可按当前由头读取相关记忆。

  普通对话仍由原有回复链路处理，本插件只负责主动消息。
version: "2.2.59"
author: 娜莉灵
repo: https://github.com/naliling/astrbot_plugin_autonomous_social
astrbot_version: ">=4.24.2"
support_platforms:
  - aiocqhttp
  - qq_official
