name: astrbot_plugin_autonomous_social
display_name: 自主拟人社交
short_desc: 让 AI 像有自己生活的人一样主动找熟人说话：念头积累、由头跟进、发送前自己判断该不该说。
desc: |
  一个自主社交层。它不代替 Humanoid Core，也不替她造身体，只负责判断“现在是否想说一句、
  想找谁、说什么更自然”。可独立运行；装了 Humanoid Core v2.14+ 后会优先读它导出的契约快照：
  睡眠压力、睡眠债、饥饿、躯体不适、唤醒度，以及她自己攒出来的“想找人说说话”的程度，
  拿这些当念头模型的燃料，而不是从两个标量硬猜；身体还会直接约束这一句该发多长、
  适不适合提问。正在睡着时几乎不会开口，而不是“概率打折后照发”。
  反过来，它会把“刚替她主动说过一句”与“被连着冷落几次”写回一个独立的信号文件，
  影响她的心境与想说的心思。两边各写各的文件，不会互相抢写。
version: "1.7.7"
author: 娜莉灵
repo: https://github.com/naliling/astrbot_plugin_autonomous_social
astrbot_version: ">=4.0.0"
support_platforms:
  - aiocqhttp
  - qq_official
  - wechat
tags:
