name: astrbot_plugin_autonomous_social
display_name: 自主拟人社交
short_desc: 想说是攒出来的，话没说完会追回来，事没结果会记着问。
desc: |
  主动发消息不难，难的是主动得有道理。

  越在意的人攒得越快，对方不玩手机的时段攒不动；攒满了还要过一句「现在说这个合适吗」，很多时候
  答案是想过，不说了。话没说完会追问那件事，事没结果会记着问后来，你一直不回她也不追。

  只在开口前调一次模型，零额外依赖。
