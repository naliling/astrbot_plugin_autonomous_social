name: astrbot_plugin_autonomous_social
display_name: 自主拟人社交
short_desc: 想说是慢慢攒出来的，话没说完会追回来，事没结果会惦记着问后来。
desc: |
  别再让 AI 永远等你先开口。

  装上它，bot 会自己惦记你——闲下来想起你就发一句，你上次没说完的事它记着、过阵子回头来问，
  聊着聊着你消失了它会追一句「人呢」。

  又不烦人：半夜不吵你，一直不回也不死缠；每次开口前先掂量一下「现在发合适吗」，
  不合适就先憋着。多个角色各用各人设，装上还能从历史聊天里认出老朋友。
  
  零额外依赖，开箱即用。
version: "1.14.2"
author: 娜莉灵
