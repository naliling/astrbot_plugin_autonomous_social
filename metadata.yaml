short_desc: 想说是慢慢攒出来的，话没说完会追回来，事没结果会惦记着问后来。
desc: |
  别再让 AI 永远等你先开口。

  她攒够了念头会主动找你：没说完的话记得回来问，没结果的事过阵子惦记着问后来。

  半夜不吵你，一直不回也不死缠；每次开口前先掂量「现在合不合适」，不合适就憋着。
  装上还能从历史聊天里认出老朋友；群里只接没人点名的话，没话说就不发。
